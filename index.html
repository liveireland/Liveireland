<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen Live — LiveIreland</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #0c1a12;
      color: #f6f1e6;
    }
    .card {
      width: min(420px, 92vw);
      background: #173324;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 6px; font-size: 1.7rem; }
    p { margin: 0 0 16px; color: #c9d6cc; }
    audio { width: 100%; }
    .status { margin-top: 12px; color: #3ecf7a; min-height: 1.2em; }
    a { color: #3ecf7a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LiveIreland</h1>
    <p>Live from Dublin · Irish traditional &amp; folk</p>

    <audio id="player" controls preload="none">
      <source src="https://lynx.prostreaming.net:8058/stream" type="audio/mpeg">
      <source src="http://lynx.prostreaming.net:8058/stream" type="audio/mpeg">
    </audio>

    <div class="status" id="status">Ready — press play</div>
    <p><a href="https://linktr.ee/liveireland">Back to LiveIreland links</a></p>
  </div>

  <script>
    const player = document.getElementById('player');
    const status = document.getElementById('status');
    player.addEventListener('playing', () => status.textContent = 'On air');
    player.addEventListener('waiting', () => status.textContent = 'Buffering…');
    player.addEventListener('pause', () => status.textContent = 'Paused');
    player.addEventListener('error', () => {
      status.textContent = 'Stream not loading — check the mount URL';
    });
  </script>
</body>
</html>
